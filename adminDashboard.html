<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles/dashStyle.css">
    </style>
  </head>
  <body data-role="admin">
    <aside class="sidebar">
      <div class="side-header">
        <h2>EMC Admin</h2>
      </div>
      <ul>
        <li>
          <a href="adminDashboard.html"
            ><i class="fa fa-tachometer" aria-hidden="true"></i>Dashboard</a
          >
        </li>
        <li>
          <a href="./manageOfficer.html"
            ><i class="fa fa-user" aria-hidden="true"></i>Manage EMC Officers</a
          >
        </li>
        <li>
          <a href="./manageStudent.html"
            ><i class="fa fa-graduation-cap" aria-hidden="true"></i>Manage
            Students</a
          >
        </li>
        <li>
          <a href="./manageInvigilator.html"
            ><i class="fa fa-users" aria-hidden="true"></i>Manage
            Invigilators</a
          >
        </li>
        <li>
          <a id="logout"
            ><i class="fa fa-sign-out" aria-hidden="true"></i>Logout</a
          >
        </li>
      </ul>
    </aside>

    <div class="main">
        <div class="user">
          <div class="welcome">Welcome, user hope you're enjoying our services.</div>
          <span class="profile avatar"></span>
        </div>
      <div class="header">
        <i class="fa fa-bars menu" aria-hidden="true"></i>
        <h2>System Overview</h2>
      </div>

      <div class="cards">
        <div class="card">
          <div class="title">
            <p>Total Invigilators</p>
            <h2 class="invigilator">124</h2>
          </div>
          <i class="fa fa-users fa-3x" aria-hidden="true"></i>
        </div>

        <div class="card">
          <div class="title">
            <p>EMC Officers</p>
            <h2 class="officer">8</h2>
          </div>
          <i class="fa fa-shield fa-3x" aria-hidden="true"></i>
        </div>

        <div class="card">
          <div class="title">
            <p>Total Cases</p>
            <h2 class="cases">342</h2>
          </div>
          <i class="fa fa-folder fa-3x" aria-hidden="true"></i>
        </div>

        <div class="card">
          <div class="title">
            <p>Active Students</p>
            <h2 class="active">560</h2>
          </div>
          <i class="fa fa-graduation-cap fa-3x" aria-hidden="true"></i>
        </div>
      </div>

      <table>
        <caption>
          Recent users
        </caption>
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Identifier</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody> </tbody>
      </table>
    </div>

    <script type="module" src="./utilityJs/dash.js"></script>
  </body>
</html>
