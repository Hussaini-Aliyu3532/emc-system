<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            background: #f2f2f2;
        }
        .container{
            margin-top: 10%;
            width: 500px;
            background: #ffff;
            border-radius: 10px;
        }
        .logo{
            background-image: url(img/logo.jpeg);
            background-position: center;
            background-size: cover;
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }
        .login-header{
            background: linear-gradient(45deg, green, blueviolet);
            color: #fff;
            padding: 30px 0;
            border-radius: 10px 10px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        form{
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }
        .input-group{
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-width: 600;
        }
        input{
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            outline: none;
            text-transform: lowercase;
        }
         input:focus{
            outline: 2px solid skyblue;
         }
         button{
            padding: 10px 0;
            border-radius: 8px;
            border: 0;
            font-size: 1.3rem;
            background: green;
            color: #fff;
         }
         button:hover{
            background: #155815;
            color: aliceblue;
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-header">
            <div class="logo"></div>
            <h2>EMC Login</h2>
        </div>
        <form class="login-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="" required>
            </div>

            <button type="submit" id="staffLogin">Login</button>
        </form>
    </div>
    
    <script type="module" src="utilityJs/loginApp.js"></script>
</body>
</html>
