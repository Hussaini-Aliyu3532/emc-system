<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>officer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../styles/dashStyle.css" />
  </head>
  <body data-role="officer" data-page="offDash">
    <aside class="sidebar">
      <div class="side-header">
        <h2>EMC Officer</h2>
      </div>
      <ul>
        <li>
          <a href="officerDash.html" class="active-link"
            ><i class="fa fa-tachometer" aria-hidden="true"></i>Dashboard</a
          >
        </li>
        <li>
          <a href="officer/viewCases.html"
            ><i class="fa-regular fa-file"></i>View Cases</a
          >
        </li>
        <li>
          <a href="./officer/scheduleMeeting.html"><i class="fa-solid fa-handshake"></i>Shedule Meeting</i></a>
        </li>
        <li>
          <a href="./officer/decision.html"><i class="fa-solid fa-gavel"></i>Decision</a>
        </li>
        <li>
          <a href="./officer/settings.html"
            ><i class="fa-solid fa-gears"></i>Settings</a
          >
        </li>
        <li>
          <a id="logout"
            ><i class="fa fa-sign-out" aria-hidden="true"></i>Logout</a
          >
        </li>
      </ul>
    </aside>

    <div class="main">
      <div class="user">
        <div class="welcome">
          Welcome, user hope you're enjoying our services.
        </div>
        <span class="profile avatar"></span>
      </div>
      <div class="header">
        <i class="fa fa-bars menu" aria-hidden="true"></i>
        <h2>Officer Dashboard</h2>
      </div>
      
      <div class="container">
        <div class="box">
          <span>Total Cases</span>
          <h2 id="total">24</h2>
        </div>
        <div class="box">
          <span>Pending</span>
          <h2 id="pending">8</h2>
        </div>
        <div class="box">
          <span>Meetings</span>
          <h2 id="meeting">8</h2>
        </div>
        <div class="box">
          <span>Decided</span>
          <h2 id="decided">8</h2>
        </div>
      </div>

      <table>
        <caption>
          Cases Requiring Attention
        </caption>
        <thead>
          <tr>
            <th>Case ID</th>
            <th>Student</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script type="module" src="../utilityJs/dash.js"></script>
  </body>
</html>
