<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invigilator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../styles/dashStyle.css" />
  </head>
  <body data-role="invigilator" data-page="settings">
    <aside class="sidebar">
      <div class="side-header">
        <h2>EMC Invigilator</h2>
      </div>
      <ul>
        <li>
          <a href="../invigilatorDash.html"
            ><i class="fa fa-tachometer" aria-hidden="true"></i>Dashboard</a
          >
        </li>
        <li>
          <a href="./reportCases.html"
            ><i class="fa-regular fa-file"></i>Report Cases</a
          >
        </li>
        <li>
          <a href="./myreport.html"
            ><i class="fa-regular fa-location"></i>My Report</a
          >
        </li>
        <li>
          <a href="settings.html" class="active-link"
            ><i class="fa-solid fa-gears"></i>Settings</a
          >
        </li>
        <li>
          <a id="logout"
            ><i class="fa fa-sign-out" aria-hidden="true"></i>Logout</a
          >
        </li>
      </ul>
    </aside>

    <div class="main">
      <div class="header">
        <i class="fa fa-bars menu" aria-hidden="true"></i>
        <h2>Profile Information</h2>
      </div>

    <div class="model1">
      <form action="" id="form1">
        <div class="input-group">
          <label for="name">User Name</label>
          <input type="text" id="name">
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>
        <button type="submit">Save</button>
      </form>
    </div>

    <div class="model2">
      <form action="" id="form2">
        <div class="input-group">
          <label for="Password">Old Password</label>
          <input type="password">
        </div>
        <button type="submit">Send</button>
      </form>
    </div>
    <div class="model3">
      <form action="" id="form3">
        <div class="input-group">
          <label for="password">New Password</label>
          <input type="password" name="" id="password">
        </div>
        <div class="input-group">
          <label for="confirm">Confirm New Password</label>
          <input type="password" id="confirm">
        </div>
        <button type="submit">Save</button>
      </form>
    </div>

    <div class="content">
      <h2>Settings</h2>
      <figure>Profile</figure>
      <hr>
      <figcaption>
        <h4>Full Name: <span class="username">username</span></h4>
        <h4>Email: <span class="email">username@emc.com</span></h4>
        <h4>Role: EMC <span class="username">username</span></h4>

        <button id="edit">Edit</button>
      </figcaption>

      <figure>Security</figure>
      <hr>
      <figcaption>
        <h4>Password</h4>
        <button id="change">Change</button>
      </figcaption>
    </div>
    </div>

    <script type="module" src="../../utilityJs/dash.js"></script>
  </body>
</html>
