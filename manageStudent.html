    <link rel="stylesheet" href="styles/style.css">

</head>
<body data-role="student">
    <aside class="sidebar">
        <div class="side-header">
            <h2>EMC Admin</h2>
        </div>
        <ul>
            <li><a href="./adminDashboard.html"><i class="fa fa-tachometer" aria-hidden="true"></i>Dashboard</a></li>
            <li><a href="./manageOfficer.html"><i class="fa fa-user" aria-hidden="true"></i>Manage EMC Officers</a></li>

        </ul>
    </aside>
    
    <div class="main">
    <div class="overlay">
    <div class="popUp">
        <header>
            <h3>Add Students</h3>
            <i id="x">X</i>
        </header>
        <form action="" class="popForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" required>
            </div>

            <div class="input-group">
                <label for="matrix">Matrix Number</label>
                <input type="text" name="matrix" id="matrix" required>
            </div>

            <div class="input-group">
                <label for="password">password</label>
                <input type="password" name="password" id="password" required>
            </div>

            <hr>
            <button id="save">Save</button>
        </form>
    </div>
    </div>

        <div class="header"><i class="fa fa-bars menu" aria-hidden="true"></i>
            <h2>Manage Students</h2>
        </div>
        <button class="addBtn"><i class="fa fa-plus-circle" aria-hidden="true"></i> Add Students</button>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Matrix</th>
                <th>Account Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        
        <tbody> </tbody>
    </table>

    <footer>&copy; 2026 Usman Danfodio University, Sokoto | EMC System</footer>
    </div>

    <script type="module" src="utilityJs/app.js?v3"></script>
